[project]
name = "cli2rest"
version = "1.0.1"
description = "Wrap arbitrary CLI tools as a FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[dependency-groups]
dev = [
    "requests",
]

[tool.uv]
# Single source of truth for the uv version: astral-sh/setup-uv reads this
# when a workflow does not pass a version input, and uv itself refuses to run
# with an older release. The floor must not exceed the uv version provided by
# the devenv shell, nor the uv bundled in the base image used by the
# Dockerfile (ghcr.io/astral-sh/uv:pythonX.Y-trixie-slim).
required-version = ">=0.13.4"
