name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - python: "3.11"
            is_default: false
          - python: "3.12"
            is_default: false
          - python: "3.13"
            is_default: false
          - python: "3.14"
            is_default: true
          - python: "3.15"
            is_default: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The uv version floor comes from tool.uv.required-version in
          # pyproject.toml; setup-uv resolves the latest release that
          # satisfies it.
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: cli2rest:test
          build-args: |
            UV_BASE_IMAGE=ghcr.io/astral-sh/uv:python${{ matrix.python }}-trixie-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --name cli2rest-test -d -p 8000:8000 cli2rest:test
          sleep 5

          # Basic health check
          curl -s http://localhost:8000/health | grep '"status":"healthy"'

          # Run integration test
          uv sync --locked
          uv run example_client.py

          # Verify output files exist
          if [ ! -f "output_output.txt" ]; then
            echo "Test failed: output_output.txt not found"
            exit 1
          fi

          echo "Integration test passed successfully."

      - name: Cleanup test container
        if: always()
        run: |
          docker stop cli2rest-test || true
          docker rm cli2rest-test || true

  build:
    name: build
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check prerequisite results
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A prerequisite job failed."
            exit 1
          fi
